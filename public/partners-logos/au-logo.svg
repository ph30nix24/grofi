    <rect x="0" y="0" width="44" height="44" rx="12" fill="#6C205F"/>
    <!-- Stylized 'au' lowercase emblem -->
    <text x="22" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#F58220" text-anchor="middle" letter-spacing="-1">
      au
    </text>
  </g>
  <!-- AU Brand Text -->
